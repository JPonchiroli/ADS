<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <header id="cabecalho">
        <h1 class="text-3xl font-bold underline ">Spotsenay</h1>
        <p id="tagline">Música para todos os alunos</p>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="#">Mais Ouvidas</a>
            <a href="#">Perfil</a> 
            <a href="cadastro.html">Cadastro</a>
            <a href="#">Contato</a>
        </nav>

    </header>

    <main id="conteudo">

        <h2>Cadastre-se</h2>

        <section>

            <form action="#" method="post">

                <ul>
                    <li>
                        <label for="nomecompleto">Nome Completo</label>
                        <input type="text" name="nomecompleto" id="nomecompleto" placeholder="Nome Completo">
                    </li>

                    <li>
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </li>

                    <li>
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" id="senha">
                    </li>
                
                    <li>
                        <label for="confirmarsenha">Confirmar Senha</label>
                        <input type="password" name="confirmarsenha" id="confirmarsenha">
                    </li>
                
                    <li>
                        <label for="prefiroouvir">Prefiro ouvir</label>
                        <select name="prefiroouvir" id="prefiroouvir">
                            <option value="sertanejo">Sertanejo</option>
                            <option value="brega">Brega</option>
                            <option value="mpb">MPB</option>
                            <option value="rock">Rock</option>
                        </select>
                    </li>

                    <li>
                        <label for="submit"></label>
                        <input  id="submit" type="submit" value="Cadastrar">
                    </li>

                </ul>
            </form>

        </section>

    </main>

    <footer id="rodape">
        <p>Desenvolvido pelo SENAI@</p>
    </footer>

</body>
</html>
