<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-dark text-white text-center py-4 mb-4">
        <div class="container">
            <h1 class="fw-bold">Spotsenay</h1>
            <p class="lead">Música para todos os alunos</p>
            <nav class="d-flex justify-content-center gap-3 mt-3 flex-wrap">
                <a href="index.html" class="text-white text-decoration-none">Início</a>
                <a href="maisOuvidas.html" class="text-white text-decoration-none">Mais Ouvidas</a>
                <a href="#" class="text-white text-decoration-none">Perfil</a>
                <a href="cadastro.html" class="text-white text-decoration-none">Cadastro</a>
                <a href="#" class="text-white text-decoration-none">Contato</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="text-center mb-4">Cadastre-se</h2>

        <section class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <form action="#" method="post" class="bg-white p-4 shadow rounded">
                    <div class="mb-3">
                        <label for="nomecompleto" class="form-label">Nome Completo</label>
                        <input type="text" name="nomecompleto" id="nomecompleto" class="form-control" placeholder="Nome Completo">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="Email">
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" name="senha" id="senha" class="form-control" placeholder="Senha">
                    </div>

                    <div class="mb-3">
                        <label for="confirmarsenha" class="form-label">Confirmar Senha</label>
                        <input type="password" name="confirmarsenha" id="confirmarsenha" class="form-control" placeholder="Confirmar Senha">
                    </div>

                    <div class="mb-4">
                        <label for="prefiroouvir" class="form-label">Prefiro ouvir</label>
                        <select name="prefiroouvir" id="prefiroouvir" class="form-select">
                            <option value="sertanejo">Sertanejo</option>
                            <option value="brega">Brega</option>
                            <option value="mpb">MPB</option>
                            <option value="rock">Rock</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">Desenvolvido pelo SENAI@</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
