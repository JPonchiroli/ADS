<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Consultas</title>
        
        <link rel="stylesheet" href="styles/reset.css">
        <link rel="stylesheet" href="styles/consulta.css">
    </head>
    <body>
        <header id="cabecalho">
            <div>
                <h1>
                    <a href="index.html">Clínica Central</a>
                </h1>
                <img src="assets/saude.jpg" alt="Simbolo Saúde">
            </div>

            <nav>
                <a href="index.html">Serviços</a>
                <a href="consulta.html">Consulta</a>
            </nav>
        </header>

        <main>
            <h1>Entre em contato para Consulta</h1>
            <section>
                <form action="#" method="post">

                    <ul>
                        <li>
                            <label for="nome">Nome Completo</label>
                            <input type="text" placeholder="Informe seu nome" id="nome">
                        </li>

                        <li>
                            <label for="email">Email</label>
                            <input type="text" placeholder="Informe seu nome" id="email">
                        </li>

                        <li>
                            <label for="areaMedica">Área Médica</label>
                            <select type="text" id="areaMedica">
                                <option value="clinicaGeral">Clinica Geral</option>
                                <option value="pediatria">Pediatria</option>
                                <option value="clinicaEspecialidade">Clinica Especialidade</option>
                                <option value="geriatria">Geriatria</option>
                                <option value="outro">Outro</option>
                            </select>
                        </li>

                        <li>
                            <label for="email">Faça uma breve descrição do que você esta sentindo</label>
                            <textarea type="text" placeholder="Informe seu nome" id="email">
                            </textarea>
                        </li>

                        <li>
                            <label for="submit"></label>
                            <input type="submit" id="submit">
                        </li>
                    </ul>

                </form>
            </section>
        </main>
    </body>
</html>
