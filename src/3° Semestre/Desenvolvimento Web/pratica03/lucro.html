<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Lucro</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="image.png" alt="logo">
                Volt Express
            </div>
            <nav>
                <ul>
                    <li><a href="administrador.html" class="btn-header">Painel</a></li>
                    <li><a href="lucro.html" class="btn-header">Gráfico de Lucro</a></li>
                    <li><a id="toggleTheme" class="btn-header">🌙 Alternar Tema</a></li>
                    <li><a href="index.html" class="btn-header">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section light">
        <div class="container">
            <h2 style="margin-bottom: 20px;">Gráfico de Lucro - Julho</h2>
            <div id="graficoLucro" style="height: 400px;"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2025 Volt Express | Todos os direitos reservados</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            Highcharts.chart('graficoLucro', {
                chart: {
                    type: 'column',
                    backgroundColor: 'white'
                },
                title: {
                    text: 'Lucro Diário (01 a 07 de Julho)'
                },
                xAxis: {
                    categories: ['01/07', '02/07', '03/07', '04/07', '05/07', '06/07', '07/07'],
                    title: { text: 'Data' }
                },
                yAxis: {
                    title: { text: 'Lucro (R$)' },
                    labels: {
                        formatter: function () {
                            return 'R$' + this.value;
                        }
                    }
                },
                series: [{
                    name: 'Lucro',
                    data: [120, 180, 150, 210, 100, 250, 320],
                    color: '#f7c844'
                }],
                tooltip: {
                    valuePrefix: 'R$'
                },
                credits: { enabled: false }
            });
        });

        const toggleButton = document.getElementById('toggleTheme');
        const body = document.body;

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            toggleButton.innerText = '☀️ Alternar Tema';
        }

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            toggleButton.innerText = isDark ? '☀️ Alternar Tema' : '🌙 Alternar Tema';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>

</html>
