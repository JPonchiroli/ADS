<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Entrega por CEP</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="verifica-cep.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">Volt Express</div>
            <nav>
                <ul>
                    <li><a href="cliente.html">Painel</a></li>
                    <li><a href="solicitar-orçamento.html">Solicitar Orçamento</a></li>
                    <li><a href="verifica-endereco.html">Verefica Endereço</a></li>
                    <li><a href="index.html" class="btn-header">Logout</a></li>
                    <li><a id="toggleTheme" class="btn-header">🌙 Alternar Tema</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="cep-check">
        <h2 style="color: #000;">Verificar Entrega por CEP</h2>
        <form id="cepForm">
            <label for="cep" style="color: #000;">Digite seu CEP:</label>
            <input type="text" id="cep" placeholder="Ex: 89010-000" required maxlength="9" />
            <button type="submit">Buscar</button>
        </form>
        <div id="enderecoResultado"></div>
    </div>

    <script>
        document.getElementById('cepForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const resultadoDiv = document.getElementById('enderecoResultado');
            resultadoDiv.innerHTML = 'Buscando endereço...';

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) throw new Error('CEP não encontrado.');

                const cidade = data.localidade;
                const uf = data.uf;

                let mensagemEntrega = '';
                let classe = '';

                const cidadeLower = cidade.toLowerCase();
                if (cidadeLower === 'blumenau') {
                    mensagemEntrega = 'Entrega em residência sem taxa';
                    classe = 'sem-taxa';
                } else if (cidadeLower === 'indaial' || cidadeLower === 'gaspar') {
                    mensagemEntrega = 'Entrega em residência com taxa';
                    classe = 'com-taxa';
                } else {
                    mensagemEntrega = 'Sem entrega em residência';
                    classe = 'sem-entrega';
                }

                const airResponse = await fetch(`https://api.api-ninjas.com/v1/airquality?city=${cidade}`, {
                    headers: { 'X-Api-Key': 'xWZIQjKBqYb1ZjlUZLsFzA==GTh04FzqcZNUdzX8' }
                });
                const airData = await airResponse.json();

                let qualidadeAr = '';
                if (airData && airData.overall_aqi !== undefined) {
                    const aqi = airData.overall_aqi;
                    if (aqi <= 50) {
                        qualidadeAr = `<br><small>Qualidade do ar: <strong>Boa</strong> (AQI ${aqi})</small>`;
                    } else {
                        qualidadeAr = `<br><small>⚠️ Qualidade do ar: <strong>Ruim</strong> (AQI ${aqi}) - pode afetar atividades ao ar livre</small>`;
                    }
                } else {
                    qualidadeAr = `<br><small>Não foi possível obter dados da qualidade do ar.</small>`;
                }

                resultadoDiv.innerHTML = `
                <div class="resultado ${classe}">
                    ${mensagemEntrega}
                    <br><small>Endereço detectado: ${data.logradouro}, ${data.bairro} - ${cidade}/${uf}</small>
                    ${qualidadeAr}
                </div>
            `;
            } catch (error) {
                resultadoDiv.innerHTML = `<div class="resultado sem-entrega">Erro: ${error.message}</div>`;
            }
        });

        const toggleButton = document.getElementById('toggleTheme');
        const body = document.body;

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            toggleButton.innerText = '☀️ Alternar Tema';
        }

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            toggleButton.innerText = isDark ? '☀️ Alternar Tema' : '🌙 Alternar Tema';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>



    <footer>
        <div class="container">
            <p>© 2025 Volt Express | Todos os direitos reservados</p>
        </div>
    </footer>
</body>

</html>
